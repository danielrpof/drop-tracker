  '@modelcontextprotocol/sdk': '>=1.31.0'
  'brace-expansion@5': '^5.0.11'
  proxy-addr: '^2.0.8'
  source-map-js: '^1.2.2'
  'undici@7': '^7.29.1'
  'undici@8': '^8.10.2'
