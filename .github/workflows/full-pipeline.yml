name: Full Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: make test-integration

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-scan:
    needs: [vet, lint, test, gitleaks, trivy-fs]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: drop-tracker:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: drop-tracker:scan
          severity: CRITICAL,HIGH
          exit-code: '1'
      # Save the exact image that just passed the scan gate so the release
      # job can push that artifact byte-for-byte, instead of rebuilding from
      # the Dockerfile a second time (07-REVIEW.md CR-02: two separate
      # `docker build` invocations of the same Dockerfile are not guaranteed
      # to produce an identical image, which would let a scanned-clean build
      # and a materially different pushed build silently diverge). Only
      # needed on the path that can actually reach the release job.
      - name: Save scanned image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save drop-tracker:scan -o /tmp/drop-tracker-scan.tar
      - name: Upload scanned image artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scanned-image
          path: /tmp/drop-tracker-scan.tar
          retention-days: 1

  release:
    needs: [build-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Job-scoped queue (not cancel) so two near-simultaneous pushes to main
    # never run `release` concurrently (07-REVIEW.md WR-04): without this,
    # both runs could check out before either pushes a tag, both compute the
    # same `svu next` version, and the second run's image push would succeed
    # before its tag push fails -- an image in the registry with no
    # corresponding git tag. Queuing serializes them so the second run's
    # checkout always sees the first run's already-pushed tag.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Compute next version with svu
        run: |
          set -e
          go install github.com/caarlos0/svu/v3@v3.4.1
          SVU="$(go env GOPATH)/bin/svu"
          CURRENT="$("$SVU" current)"
          NEXT="$("$SVU" next)"
          if [ "$NEXT" = "$CURRENT" ]; then
            echo "::error::svu next ($NEXT) equals svu current ($CURRENT) -- no recognized conventional-commit prefix (feat/fix/BREAKING CHANGE) was found in the commits merged since the last tag, so no version bump could be computed. The pr-title job is the gate that normally prevents an unrecognized-prefix squash-merge message from reaching main; check the merge commit's message." >&2
            exit 1
          fi
          echo "VERSION=$NEXT" >> "$GITHUB_ENV"
      - name: Download scanned image artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scanned-image
          path: /tmp
      - name: Load scanned image
        run: docker load -i /tmp/drop-tracker-scan.tar
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag and push the scanned image
        run: |
          set -e
          docker tag drop-tracker:scan "ghcr.io/danielrpof/drop-tracker:${VERSION}"
          docker push "ghcr.io/danielrpof/drop-tracker:${VERSION}"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ghcr.io/danielrpof/drop-tracker:${{ env.VERSION }}
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ env.VERSION }}
          path: sbom.spdx.json
          retention-days: 90
      - name: Tag release
        run: |
          set -e
          git tag "$VERSION"
          git push origin "$VERSION"
